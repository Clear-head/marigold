[pytest]
# pytest 설정 파일

# 테스트 파일 패턴
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 마커 정의
markers =
    unit: Unit tests that don't require external services
    integration: Integration tests that require external services (Redis, MongoDB)
    asyncio: Tests that use async/await

# 비동기 테스트 모드
asyncio_mode = auto

# 출력 옵션
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:warnings

# 테스트 경로
testpaths = tests

# 최소 커버리지 (선택사항)
# --cov=libs/commons
# --cov-report=html
# --cov-report=term-missing