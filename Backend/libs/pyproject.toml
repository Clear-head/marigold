[project]
name = "libs"
version = "0.1.0"
description = ""
authors = [
    {name = "marigold-team", email = "huni032285@gmail.com"}
]
readme = "libs.md"
requires-python = ">=3.11.0,<3.14"
dependencies = ["pyjwt (>=2.10.1,<3.0.0)",
    "beanie (>=2.0.1,<3.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "redis[hiredis] (>=7.1.0,<8.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "aiokafka (>=0.13.0,<0.14.0)"
]

[tool.poetry]
packages = [
    { include = "commons" },
    { include = "databases" },
    { include = "dto" },
    { include = "exceptions" }
]


[tool.pytest.ini_options]
# pytest 설정

# 테스트 파일 패턴
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# 마커 정의
markers = [
    "unit: Unit tests that don't require external services",
    "integration: Integration tests that require external services (Redis, MongoDB)",
    "asyncio: Tests that use async/await",
    "slow: Slow running tests"
]

# 비동기 테스트 모드
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# 출력 옵션
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-ra",  # 모든 테스트 결과 요약
]

# 테스트 경로
testpaths = ["tests"]

# 경고 필터
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"